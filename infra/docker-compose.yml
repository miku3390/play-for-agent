services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handkerchief
      POSTGRES_PASSWORD: handkerchief
      POSTGRES_DB: handkerchief
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: handkerchief
      MINIO_ROOT_PASSWORD: handkerchief123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # 应用服务示例（镜像构建：docker build -f infra/Dockerfile.service --build-arg SERVICE=user .）
  # user:
  #   build:
  #     context: ..
  #     dockerfile: infra/Dockerfile.service
  #     args: { SERVICE: user }
  #   ports: ["8001:8000"]

volumes:
  pgdata:
  miniodata:
